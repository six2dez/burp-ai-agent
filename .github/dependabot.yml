version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      ktor:
        patterns:
          - "io.ktor:*"
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx:*"
      jackson:
        patterns:
          - "com.fasterxml.jackson.*"
      netty:
        patterns:
          - "io.netty:*"
    # Kotlin, kotlinx, Ktor, the MCP SDK, the Kotlin Gradle plugins and the CycloneDX plugin must
    # move together, so their minor and major updates are ignored here (patch updates still
    # arrive) until the joint toolchain upgrade, which removes these rules. The CycloneDX 3.x
    # migration is done by hand. Netty, the ktlint Gradle plugin and the Gradle wrapper move with
    # the same joint toolchain upgrade: Ktor 3.1.3 is built against Netty 4.1 (so only Netty patch
    # updates arrive), and Gradle 9 needs a newer Shadow plugin.
    ignore:
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlinx:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "io.ktor:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "io.modelcontextprotocol:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jvm"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "plugin.serialization"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.cyclonedx.bom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "io.netty:*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jlleitschuh.gradle.ktlint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
